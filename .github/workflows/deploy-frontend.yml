name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - my-temp-frontend
    paths-ignore:
      - 'README.md'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Build and Push Docker image
      run: |
        cd frontend
        gcloud builds submit --tag europe-southwest1-docker.pkg.dev/project-d9cf7253-c2d0-4f51-9ab/cloud-run-source-deploy/dev-frontend-service:${{ github.sha }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy dev-frontend-service \
          --image europe-southwest1-docker.pkg.dev/project-d9cf7253-c2d0-4f51-9ab/cloud-run-source-deploy/dev-frontend-service:${{ github.sha }} \
          --region europe-southwest1
